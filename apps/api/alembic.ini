# Alembic configuration for DocExtract AI.
#
# The database URL is NOT set here: alembic reads it from the application
# settings (DATABASE_URL env var / .env file) inside alembic/env.py, so the
# same twelve-factor rule as the API applies — no credentials in committed
# files.

[alembic]
script_location = alembic
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .
# sqlalchemy.url is intentionally left empty; env.py supplies it from settings.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S