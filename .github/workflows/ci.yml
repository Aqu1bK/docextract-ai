# Continuous Integration gate for DocExtract AI (Phase 2.5).
#
# Four jobs run in parallel on every push to development/main and every PR
# targeting them. Any failing job marks the whole run red; combined with the
# branch protection rule on main (docs/phase-2.5-ci-gate.md), a red run
# cannot merge. No continue-on-error anywhere: a gate that can be driven
# through is not a gate.

name: CI

on:
  push:
    branches: [development, main]
  pull_request:
    branches: [development, main]

jobs:
  # Cheapest job, listed first: no Python setup, no installs — only a checkout.
  # .env files hold real credentials locally; .env.example (the safe template)
  # does NOT match the exact-name find and stays committable.
  secrets-scan:
    name: Secrets Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for .env files
        run: |
          if find . -name ".env" -o -name ".env.local" | grep -q .; then
            echo "❌ Found .env files in commit. These should never be committed."
            exit 1
          fi
          echo "✅ No .env files found"

  # Mirrors the local command `ruff check .` + `ruff format --check .` so
  # "green locally" and "green in CI" are the same statement.
  backend-lint:
    name: Backend Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Keyed on the hash of pyproject.toml: the cache auto-invalidates the
      # moment dependencies change, and restore-keys lets an old cache serve
      # as a fallback instead of a cold miss.
      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('apps/api/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      # Editable install with the dev extra = the same environment the
      # Makefile builds locally, so CI tests the code developers run.
      - name: Install dependencies
        working-directory: apps/api
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run ruff check
        working-directory: apps/api
        run: ruff check .
      - name: Run ruff format check
        working-directory: apps/api
        run: ruff format --check .

  # Strict mypy runs in its own job so a type error is never buried under
  # lint or test output in the GitHub UI.
  backend-typecheck:
    name: Backend Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('apps/api/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: Install dependencies
        working-directory: apps/api
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run mypy
        working-directory: apps/api
        run: mypy app

  # The pytest suite (4 tests in Phase 2) — the final say on "does it work".
  backend-test:
    name: Backend Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('apps/api/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: Install dependencies
        working-directory: apps/api
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run pytest
        working-directory: apps/api
        run: pytest -v
